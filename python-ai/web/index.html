<style>
:root{color-scheme:dark;--bg:#090b0e;--panel:#0f1217;--panel2:#151922;--panel3:#1b202b;--text:#f2f4f7;--muted:#929baa;--dim:#626b79;--line:#232a35;--a:#9c83ff;--b:#52dfbd;--bad:#ff7386;--shadow:0 26px 70px #0007;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}html[data-theme="light"]{color-scheme:light;--bg:#f5f7fa;--panel:#fff;--panel2:#f0f3f7;--panel3:#e9edf3;--text:#15181d;--muted:#69727f;--dim:#929aa6;--line:#e0e5eb;--a:#7153e7;--b:#168a70;--bad:#d84e62;--shadow:0 20px 50px #26364b1c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:258px minmax(0,1fr) 244px}.side{background:var(--panel);border-right:1px solid var(--line);padding:13px 10px;display:flex;flex-direction:column;min-width:0}.brand{display:flex;align-items:center;gap:9px;padding:4px 5px 13px}.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));color:#08090b;font-weight:900}.brand b{font-size:13px}.brand small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.btn-icon{border:0;background:transparent;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}.btn-icon:hover{background:var(--panel2);color:var(--text)}.new{border:1px solid var(--line);background:var(--panel2);height:40px;border-radius:10px;padding:0 11px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}.new span:last-child{margin-left:auto;color:var(--dim);font-size:9px}.search{display:flex;align-items:center;gap:7px;margin:9px 3px 4px;border-bottom:1px solid var(--line);padding:8px 5px;color:var(--muted)}.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;font-size:11px}.nav{display:grid;gap:2px;margin-top:4px}.nav button,.side-foot button{border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:9px;border-radius:9px;padding:9px 10px;font-size:11px;text-align:left}.nav button:hover,.nav button.active,.side-foot button:hover{background:var(--panel2);color:var(--text)}.section{margin-top:15px;display:flex;flex-direction:column;min-height:0;flex:1}.label{text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-size:8px;font-weight:800;padding:0 8px 6px}.chat-list{overflow:auto}.chat-row{width:100%;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:8px 9px;text-align:left;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-row:hover,.chat-row.active{background:var(--panel2);color:var(--text)}.side-foot{border-top:1px solid var(--line);padding-top:7px}.side-foot button{width:100%}.main{height:100%;min-width:0;display:flex;flex-direction:column}.top{height:56px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.top-title b{display:block;font-size:11px;max-width:430px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-title small{font-size:8px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:4px}.status{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);font-size:9px}.dot{width:6px;height:6px;border-radius:50%;background:var(--b)}.dot.bad{background:var(--bad)}.content{min-height:0;flex:1;position:relative;display:flex;flex-direction:column}.view{height:100%;overflow:auto}.messages{max-width:760px;margin:auto;padding:42px 32px 165px}.msg{display:grid;grid-template-columns:27px 1fr;gap:11px;margin-bottom:32px}.avatar{width:26px;height:26px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--panel2);font-size:10px}.msg.ai .avatar{background:linear-gradient(135deg,#9c83ff33,#52dfbd22)}.who{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:2px 0 8px}.md{font-size:13px;line-height:1.72}.md p{margin:.7em 0}.md h1,.md h2,.md h3{line-height:1.25;margin:1.2em 0 .5em}.md h1{font-size:22px}.md h2{font-size:17px}.md h3{font-size:14px}.md code{font-family:Consolas,monospace;background:var(--panel2);padding:2px 5px;border-radius:5px}.md pre{white-space:pre-wrap;background:#080a0f;border:1px solid var(--line);padding:13px;border-radius:10px;overflow:auto}.md blockquote{border-left:2px solid var(--a);margin:1em 0;padding-left:12px;color:var(--muted)}.msg-actions{display:flex;gap:2px;margin-top:9px;opacity:0}.msg:hover .msg-actions{opacity:1}.msg-actions button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:5px 7px;font-size:8px}.msg-actions button:hover{background:var(--panel2);color:var(--text)}.typing:after{content:'●';color:var(--a);animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:30px 20px 12px;background:linear-gradient(transparent,var(--bg) 31%)}.composer{max-width:760px;margin:auto;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:15px;padding:10px}.composer textarea{width:100%;max-height:180px;resize:none;border:0;outline:0;background:transparent;padding:5px 7px;font-size:13px;line-height:1.5}.composebar{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.compose-tools{display:flex;gap:2px}.compose-tools button{border:0;background:transparent;color:var(--muted);height:29px;border-radius:8px;padding:0 8px;font-size:10px}.compose-tools button:hover{background:var(--panel2);color:var(--text)}.mode{border:1px solid var(--line)!important}.send{width:31px;height:31px;border:0;border-radius:9px;background:var(--text);color:var(--bg);font-size:15px;font-weight:900}.send:disabled{opacity:.25}.send.stop{background:var(--panel3);color:var(--text)}.note{text-align:center;color:var(--dim);font-size:8px;margin-top:6px}.activity{background:var(--panel);border-left:1px solid var(--line);padding:16px 12px;overflow:auto}.act-head{font-size:10px;color:var(--muted);font-weight:700;margin:4px 3px 14px}.act{display:grid;grid-template-columns:8px 1fr;gap:6px;border-bottom:1px solid var(--line);padding:9px 2px}.act b{font-size:9px}.act p{font-size:8px;line-height:1.4;color:var(--muted);margin:3px 0}.empty-act{text-align:center;color:var(--dim);font-size:9px;line-height:1.5;padding:45px 8px}.page{max-width:1050px;margin:auto;padding:44px clamp(20px,5vw,68px) 70px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:29px}.page h1{font-size:26px;letter-spacing:-.03em;margin:0 0 6px}.page-head p{font-size:11px;color:var(--muted);margin:0}.primary{border:0;border-radius:9px;background:var(--text);color:var(--bg);padding:9px 12px;font-size:10px;font-weight:750}.field{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:0}.inline{display:flex;gap:7px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{position:relative;min-height:140px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px}.card:hover{border-color:#9c83ff66}.card .ico,.tool .ico{width:33px;height:33px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;color:var(--a);margin-bottom:12px}.card b{font-size:12px}.card p{font-size:9px;color:var(--muted);line-height:1.4}.card small{font-size:8px;color:var(--dim);position:absolute;left:14px;bottom:13px}.del{position:absolute;right:8px;top:8px;border:0;background:transparent;color:var(--muted);opacity:0}.card:hover .del{opacity:1}.memory-form{display:grid;grid-template-columns:170px 1fr auto;gap:7px;margin-bottom:17px}.memory-form textarea{min-height:60px;resize:vertical}.list{display:grid;gap:6px}.list-item{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px}.list-item b{font-size:11px}.list-item p{font-size:10px;color:var(--muted);line-height:1.5;margin:4px 28px 3px 0}.list-item small{font-size:8px;color:var(--dim)}.file-row{display:grid;grid-template-columns:38px 1fr 32px;gap:9px;align-items:center;border-bottom:1px solid var(--line);padding:9px 2px}.file-row .ico{width:33px;height:33px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;color:var(--a)}.file-row b{font-size:10px;display:block}.file-row span{font-size:8px;color:var(--muted)}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:11px}.tool .ico{margin:0}.tool b{font-size:10px}.tool p{font-size:8px;color:var(--muted);margin:3px 0}.tag{border:1px solid var(--line);border-radius:99px;padding:3px 6px;font-size:7px;color:var(--muted)}.tag.local{color:var(--b)}.tag.backend{color:var(--a)}.empty{border:1px dashed var(--line);border-radius:11px;min-height:155px;grid-column:1/-1;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:10px}.modal-bg{position:fixed;inset:0;z-index:50;background:#0008;backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px}.modal{width:min(850px,96vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:17px}.modal-head p{margin:4px 0 0;font-size:9px;color:var(--muted)}.settings{display:grid;grid-template-columns:1fr 1fr}.settings section{padding:18px;border-bottom:1px solid var(--line)}.settings section:nth-child(odd){border-right:1px solid var(--line)}.settings h3{font-size:10px;margin:0 0 14px}.settings label{display:flex;flex-direction:column;gap:5px;font-size:8px;color:var(--muted);margin-bottom:10px}.settings input,.settings textarea,.settings select{width:100%;font-size:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;outline:0}.settings textarea{min-height:110px}.switch{flex-direction:row!important;justify-content:space-between;align-items:center}.backup{display:flex;gap:7px;flex-wrap:wrap}.backup button,.backup label{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:9px;cursor:pointer}.mobile-menu,.scrim{display:none}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;background:var(--text);color:var(--bg);padding:8px 12px;border-radius:9px;font-size:9px;box-shadow:var(--shadow)}
@media(max-width:1080px){.app{grid-template-columns:230px 1fr}.activity{display:none}}@media(max-width:720px){.app{display:block}.side{position:fixed;z-index:40;width:270px;inset:0 auto 0 0;transform:translateX(-105%);transition:.2s;box-shadow:var(--shadow)}.side.open{transform:none}.scrim.show{display:block;position:fixed;z-index:35;inset:0;background:#0007}.mobile-menu{display:grid}.status{display:none}.messages{padding:28px 15px 155px}.composer-wrap{padding-left:9px;padding-right:9px}.page{padding:28px 14px 70px}.page-head{flex-direction:column}.cards,.tools{grid-template-columns:1fr}.memory-form{grid-template-columns:1fr}.settings{grid-template-columns:1fr}.settings section:nth-child(odd){border-right:0}.msg-actions{opacity:1}}

<body><div id="app"></div><input id="filePicker" type="file" multiple hidden><input id="backupPicker" type="file" accept="application/json" hidden>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const uid=()=>crypto.randomUUID();const iso=()=>new Date().toISOString();const STORE='python-ai-definitive-v1';
const initial=()=>({activeView:'chat',activeConversationId:'welcome',activeProjectId:null,conversations:[{id:'welcome',title:'Comece por aqui',projectId:null,createdAt:iso(),updatedAt:iso(),messages:[{id:uid(),role:'assistant',content:'## Python AI está pronta\n\nEsta é a edição web completa: **chat, memória, projetos, arquivos, voz, ferramentas e múltiplos modelos**.\n\nNo modo **Automático**, tento usar a IA nativa do Chrome quando a Prompt API estiver disponível. Se não estiver, começo em modo local demonstrativo. Você também pode conectar **Ollama**, um endpoint **OpenAI compatível** ou o **backend Python AI** nas Configurações.\n\nExperimente `calcule 18.9 * 37` ou `que horas são?`.',createdAt:iso()}]}],projects:[],memories:[],files:[],toolRuns:[],settings:{provider:'auto',model:'',apiBase:'',apiKey:'',backendUrl:'',theme:'dark',temperature:.7,showActivity:true,systemPrompt:'Você é Python AI, um assistente útil, criterioso e direto. Responda em português do Brasil, salvo quando o usuário pedir outro idioma.'}});
let state=(()=>{try{return Object.assign(initial(),JSON.parse(localStorage.getItem(STORE)||'null')||{})}catch{return initial()}})();let busy=false,aborter=null,mode='chat';
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));const setState=fn=>{state=typeof fn==='function'?fn(state):Object.assign(state,fn);save();render()};
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function md(s){let t=esc(s);t=t.replace(/```([\s\S]*?)```/g,(_,c)=>'<pre><code>'+c.trim()+'</code></pre>');t=t.replace(/`([^`]+)`/g,'<code>$1</code>');t=t.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');t=t.replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>');t=t.replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');return t.split(/\n{2,}/).map(x=>/^<(h|pre|ul|blockquote)/.test(x)?x:'<p>'+x.replace(/\n/g,'<br>')+'</p>').join('')}
function icon(n){const I={chat:'◫',project:'◇',memory:'◎',file:'▤',tool:'⌘',settings:'⚙',search:'⌕',attach:'＋',mic:'●',activity:'◌'};return I[n]||'•'}
function activeConv(){return state.conversations.find(c=>c.id===state.activeConversationId)}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function render(){document.documentElement.dataset.theme=state.settings.theme||'dark';const c=activeConv();const view=state.activeView;const chats=[...state.conversations].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));$('#app').innerHTML=`<div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">Py</div><div><b>Python AI</b><small>workspace pessoal</small></div></div><button class="new" data-act="new">＋ <span>Novo chat</span><span>Ctrl N</span></button><div class="search">${icon('search')}<input id="chatSearch" placeholder="Pesquisar conversas"></div><nav class="nav">${[['projects','project','Projetos'],['memories','memory','Memórias'],['files','file','Arquivos'],['tools','tool','Ferramentas']].map(x=>`<button data-view="${x[0]}" class="${view===x[0]?'active':''}">${icon(x[1])} ${x[2]}</button>`).join('')}</nav><div class="section"><div class="label">Conversas</div><div class="chat-list">${chats.map(x=>`<button class="chat-row ${view==='chat'&&x.id===state.activeConversationId?'active':''}" data-chat="${x.id}" data-title="${esc(x.title.toLowerCase())}">${esc(x.title)}</button>`).join('')}</div></div><div class="side-foot"><button data-act="settings">${icon('settings')} Configurações</button></div></aside><div class="scrim" id="scrim"></div><main class="main"><header class="top"><div style="display:flex;gap:8px;align-items:center"><button class="btn-icon mobile-menu" data-act="menu">☰</button><div class="top-title"><b>${esc(view==='chat'?(c?.title||'Novo chat'):({projects:'Projetos',memories:'Memórias',files:'Arquivos',tools:'Ferramentas'}[view]))}</b><small>${state.activeProjectId?esc(state.projects.find(p=>p.id===state.activeProjectId)?.name||''):''}</small></div></div><div class="top-actions"><div class="status" id="status"><span class="dot"></span><span>verificando…</span></div><button class="btn-icon" data-act="theme">${state.settings.theme==='dark'?'☀':'☾'}</button><button class="btn-icon" data-act="settings">⚙</button></div></header><section class="content">${renderView()}</section></main>${state.settings.showActivity&&view==='chat'?renderActivity():''}</div>`;wire();checkStatus()}
function renderView(){if(state.activeView==='chat')return renderChat();if(state.activeView==='projects')return renderProjects();if(state.activeView==='memories')return renderMemories();if(state.activeView==='files')return renderFiles();return renderTools()}
function renderChat(){const c=activeConv();return `<div class="view" id="chatView"><div class="messages">${(c?.messages||[]).map(m=>`<article class="msg ${m.role==='assistant'?'ai':'user'}"><div class="avatar">${m.role==='assistant'?'AI':'U'}</div><div><div class="who">${m.role==='assistant'?'Python AI':'Você'}</div><div class="md ${m.streaming?'typing':''}">${md(m.content||'')}</div><div class="msg-actions"><button data-copy="${m.id}">Copiar</button>${m.role==='assistant'&&!m.streaming?`<button data-speak="${m.id}">Ouvir</button><button data-regen="${m.id}">Refazer</button>`:''}</div></div></article>`).join('')}</div></div><div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" placeholder="Pergunte qualquer coisa…"></textarea><div class="composebar"><div class="compose-tools"><button data-act="attach">${icon('attach')} Anexar</button><button data-act="mic">${icon('mic')} Voz</button><button class="mode" data-act="mode">${mode==='agent'?'Agente':'Chat'}</button></div>${busy?'<button class="send stop" data-act="stop">■</button>':'<button class="send" id="send" data-act="send" disabled>↑</button>'}</div></div><div class="note">Python AI pode cometer erros. Verifique informações importantes.</div></div>`}
function renderActivity(){return `<aside class="activity"><div class="act-head">${icon('activity')} Atividade</div>${state.toolRuns.slice(-7).reverse().map(r=>`<div class="act"><span class="dot ${r.status==='error'?'bad':''}"></span><div><b>${esc(r.tool)}</b><p>${esc(r.detail)}</p></div></div>`).join('')||'<div class="empty-act">Ferramentas usadas pela conversa aparecerão aqui.</div>'}</aside>`}
function renderProjects(){return `<div class="view"><div class="page"><div class="page-head"><div><h1>Projetos</h1><p>Separe conversas, arquivos e contexto por objetivo.</p></div><div class="inline"><input class="field" id="projectName" placeholder="Nome do projeto"><button class="primary" data-act="addProject">＋ Criar</button></div></div><div class="cards">${state.projects.map(p=>`<div class="card" data-project="${p.id}"><div class="ico">◇</div><b>${esc(p.name)}</b><p>${state.conversations.filter(c=>c.projectId===p.id).length} conversas · ${state.files.filter(f=>f.projectId===p.id).length} arquivos</p><small>${new Date(p.createdAt).toLocaleDateString('pt-BR')}</small><button class="del" data-del-project="${p.id}">×</button></div>`).join('')||'<div class="empty">Nenhum projeto ainda. Crie um para organizar trabalhos longos.</div>'}</div></div></div>`}
function renderMemories(){return `<div class="view"><div class="page"><div class="page-head"><div><h1>Memórias</h1><p>Contexto persistente que pode ser recuperado pelas conversas.</p></div></div><div class="memory-form"><input class="field" id="memTitle" placeholder="Título"><textarea class="field" id="memContent" placeholder="O que a IA deve lembrar?"></textarea><button class="primary" data-act="addMemory">＋ Adicionar</button></div><div class="list">${state.memories.map(m=>`<div class="list-item"><b>${esc(m.title)}</b><p>${esc(m.content)}</p><small>${new Date(m.createdAt).toLocaleDateString('pt-BR')}</small><button class="del" style="opacity:1" data-del-memory="${m.id}">×</button></div>`).join('')||'<div class="empty">A memória está vazia.</div>'}</div></div></div>`}
function renderFiles(){return `<div class="view"><div class="page"><div class="page-head"><div><h1>Arquivos</h1><p>Arquivos textuais são indexados localmente para contexto.</p></div><button class="primary" data-act="attach">＋ Adicionar arquivos</button></div><div class="list">${state.files.map(f=>`<div class="file-row"><div class="ico">▤</div><div><b>${esc(f.name)}</b><span>${Math.max(1,Math.round(f.size/1024))} KB · ${esc(f.type||'arquivo')}</span></div><button class="btn-icon" data-del-file="${f.id}">×</button></div>`).join('')||'<div class="empty">Nenhum arquivo. TXT, Markdown, JSON, CSV e código podem ser lidos localmente.</div>'}</div></div></div>`}
function renderTools(){const tools=[['Calculadora','Aritmética segura local','local'],['Data e hora','Relógio do dispositivo','local'],['Memória','Busca contextual persistente','local'],['Arquivos','Pesquisa conteúdo anexado','local'],['Voz','Ditado e leitura do navegador','browser'],['Python sandbox','Disponível no backend opcional','backend']];return `<div class="view"><div class="page"><div class="page-head"><div><h1>Ferramentas</h1><p>Capacidades locais, do navegador e do backend Python.</p></div></div><div class="tools">${tools.map(t=>`<div class="tool"><div class="ico">⌘</div><div><b>${t[0]}</b><p>${t[1]}</p></div><span class="tag ${t[2]}">${t[2]}</span></div>`).join('')}</div></div></div>`}
function settingsModal(){const s=state.settings;const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal"><div class="modal-head"><div><h2>Configurações</h2><p>Modelos, aparência, dados e comportamento.</p></div><button class="btn-icon" id="closeSettings">×</button></div><div class="settings"><section><h3>Modelo</h3><label>Provedor<select id="provider"><option value="auto">Automático</option><option value="chrome">Chrome AI</option><option value="demo">Local demo</option><option value="ollama">Ollama</option><option value="openai">OpenAI compatível</option><option value="backend">Backend Python AI</option></select></label><label>URL base / endpoint<input id="apiBase" value="${esc(s.apiBase||'')}" placeholder="http://localhost:11434"></label><label>Modelo<input id="model" value="${esc(s.model||'')}" placeholder="llama3.2:3b"></label><label>Chave da API<input id="apiKey" type="password" value="${esc(s.apiKey||'')}" placeholder="Fica só neste navegador"></label><label>URL backend<input id="backendUrl" value="${esc(s.backendUrl||'')}" placeholder="https://seu-backend"></label><label>Temperatura <span id="tempVal">${s.temperature}</span><input id="temperature" type="range" min="0" max="1.5" step="0.1" value="${s.temperature}"></label></section><section><h3>Instruções</h3><label>Prompt do sistema<textarea id="systemPrompt">${esc(s.systemPrompt)}</textarea></label><label class="switch"><span>Mostrar atividade</span><input id="showActivity" type="checkbox" ${s.showActivity?'checked':''}></label></section><section><h3>Aparência</h3><label>Tema<select id="theme"><option value="dark">Escuro</option><option value="light">Claro</option></select></label></section><section><h3>Dados</h3><p style="font-size:9px;color:var(--muted)">Conversas, memórias e chaves ficam apenas no armazenamento local deste navegador.</p><div class="backup"><button id="exportBackup">Exportar backup</button><label>Importar backup<input hidden type="file" id="importBackup" accept="application/json"></label></div></section></div></div>`;document.body.appendChild(bg);$('#provider',bg).value=s.provider;$('#theme',bg).value=s.theme;const sync=()=>{state.settings={...state.settings,provider:$('#provider',bg).value,apiBase:$('#apiBase',bg).value.trim(),model:$('#model',bg).value.trim(),apiKey:$('#apiKey',bg).value,backendUrl:$('#backendUrl',bg).value.trim(),temperature:Number($('#temperature',bg).value),systemPrompt:$('#systemPrompt',bg).value,showActivity:$('#showActivity',bg).checked,theme:$('#theme',bg).value};save();document.documentElement.dataset.theme=state.settings.theme;$('#tempVal',bg).textContent=state.settings.temperature};$$('input,textarea,select',bg).forEach(x=>x.addEventListener('input',sync));$('#closeSettings',bg).onclick=()=>{bg.remove();render()};bg.onclick=e=>{if(e.target===bg){bg.remove();render()}};$('#exportBackup',bg).onclick=exportBackup;$('#importBackup',bg).onchange=e=>importBackup(e.target.files[0])}
function wire(){$$('[data-view]').forEach(b=>b.onclick=()=>{state.activeView=b.dataset.view;save();render()});$$('[data-chat]').forEach(b=>b.onclick=()=>{state.activeView='chat';state.activeConversationId=b.dataset.chat;save();render()});$$('[data-act="settings"]').forEach(b=>b.onclick=settingsModal);$$('[data-act="new"]').forEach(b=>b.onclick=()=>newChat());$$('[data-act="theme"]').forEach(b=>b.onclick=()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render()});const q=$('#chatSearch');if(q)q.oninput=()=>$$('.chat-row').forEach(r=>r.hidden=!r.dataset.title.includes(q.value.toLowerCase()));const prompt=$('#prompt');if(prompt){prompt.oninput=()=>{prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,180)+'px';$('#send').disabled=!prompt.value.trim()};prompt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendPrompt()}}}$$('[data-act="send"]').forEach(b=>b.onclick=sendPrompt);$$('[data-act="stop"]').forEach(b=>b.onclick=()=>aborter?.abort());$$('[data-act="mode"]').forEach(b=>b.onclick=()=>{mode=mode==='chat'?'agent':'chat';render()});$$('[data-act="attach"]').forEach(b=>b.onclick=()=>$('#filePicker').click());$$('[data-act="mic"]').forEach(b=>b.onclick=startVoice);$$('[data-copy]').forEach(b=>b.onclick=()=>{const m=messageById(b.dataset.copy);navigator.clipboard?.writeText(m?.content||'');toast('Copiado')});$$('[data-speak]').forEach(b=>b.onclick=()=>speak(messageById(b.dataset.speak)?.content||''));$$('[data-regen]').forEach(b=>b.onclick=()=>regenerate(b.dataset.regen));const addP=$('[data-act="addProject"]');if(addP)addP.onclick=()=>{const n=$('#projectName').value.trim();if(n){state.projects.unshift({id:uid(),name:n,createdAt:iso()});save();render()}};$$('[data-project]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-del-project]'))return;state.activeProjectId=c.dataset.project;newChat(c.dataset.project)});$$('[data-del-project]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.delProject;state.projects=state.projects.filter(p=>p.id!==id);state.conversations.forEach(c=>{if(c.projectId===id)c.projectId=null});state.files.forEach(f=>{if(f.projectId===id)f.projectId=null});save();render()});const addM=$('[data-act="addMemory"]');if(addM)addM.onclick=()=>{const t=$('#memTitle').value.trim(),c=$('#memContent').value.trim();if(t&&c){state.memories.unshift({id:uid(),title:t,content:c,createdAt:iso()});save();render()}};$$('[data-del-memory]').forEach(b=>b.onclick=()=>{state.memories=state.memories.filter(m=>m.id!==b.dataset.delMemory);save();render()});$$('[data-del-file]').forEach(b=>b.onclick=()=>{state.files=state.files.filter(f=>f.id!==b.dataset.delFile);save();render()});const menu=$('[data-act="menu"]');if(menu)menu.onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('show')};const scr=$('#scrim');if(scr)scr.onclick=()=>{$('#side').classList.remove('open');scr.classList.remove('show')};const cv=$('#chatView');if(cv)cv.scrollTop=cv.scrollHeight}
function messageById(id){for(const c of state.conversations){const m=c.messages.find(m=>m.id===id);if(m)return m}}
function newChat(projectId=null){const c={id:uid(),title:'Novo chat',projectId,createdAt:iso(),updatedAt:iso(),messages:[]};state.conversations.unshift(c);state.activeConversationId=c.id;state.activeView='chat';state.activeProjectId=projectId;save();render()}
$('#filePicker').onchange=async e=>{for(const f of [...e.target.files]){let text='';if(f.type.startsWith('text/')||/\.(md|json|csv|py|js|ts|html|css|xml|ya?ml)$/i.test(f.name)){try{text=(await f.text()).slice(0,250000)}catch{}}state.files.unshift({id:uid(),name:f.name,type:f.type,size:f.size,text,projectId:state.activeProjectId,createdAt:iso()})}save();render();toast('Arquivos adicionados')};
function addRun(tool,status,detail){state.toolRuns.push({id:uid(),tool,status,detail,createdAt:iso()});save()}
function arithmetic(expr){const clean=expr.replace(/,/g,'.').replace(/\^/g,'**').trim();if(!/^[0-9+\-*/().%\s*]+$/.test(clean))throw Error('Expressão não permitida');const v=Function('"use strict";return ('+clean+')')();if(typeof v!=='number'||!isFinite(v))throw Error('Resultado inválido');return v}
function tools(input){let context='';const m=input.match(/(?:calcule|calcular|quanto (?:é|da)|resultado de)\s*[:=]?\s*([0-9.,+\-*/()%\s^]+)/i);if(m){try{const v=arithmetic(m[1]);context+='\nResultado da calculadora: '+m[1].trim()+' = '+v;addRun('Calculadora','ok',m[1].trim()+' = '+v)}catch(e){addRun('Calculadora','error',e.message)}}if(/que horas|horário|hora agora/i.test(input)){const v=new Intl.DateTimeFormat('pt-BR',{dateStyle:'full',timeStyle:'medium'}).format(new Date());context+='\nData e hora local: '+v;addRun('Data e hora','ok',v)}const words=input.toLowerCase().split(/\s+/).filter(w=>w.length>4);const mh=state.memories.filter(x=>words.some(w=>(x.title+' '+x.content).toLowerCase().includes(w))).slice(0,4);if(mh.length){context+='\nMemórias relevantes:\n'+mh.map(x=>'- '+x.title+': '+x.content).join('\n');addRun('Memória','ok',mh.length+' memória(s) relacionada(s)')}const fh=state.files.filter(x=>x.text&&words.some(w=>(x.name+' '+x.text).toLowerCase().includes(w))).slice(0,3);if(fh.length){context+='\nArquivos relevantes:\n'+fh.map(x=>'### '+x.name+'\n'+x.text.slice(0,1600)).join('\n');addRun('Arquivos','ok',fh.length+' arquivo(s) relacionado(s)')}return context}
async function sendPrompt(){if(busy)return;const p=$('#prompt'),input=p?.value.trim();if(!input)return;const c=activeConv();if(!c)return;const user={id:uid(),role:'user',content:input,createdAt:iso()},ai={id:uid(),role:'assistant',content:'',createdAt:iso(),streaming:true};if(!c.messages.length)c.title=input.replace(/\s+/g,' ').slice(0,42);c.messages.push(user,ai);c.updatedAt=iso();busy=true;aborter=new AbortController();save();render();const context=tools(input);let full='';try{await generate(c.messages.slice(0,-1),input,context,d=>{full+=d;ai.content=full;save();patchStreaming(ai.id,full)},aborter.signal);ai.streaming=false}catch(e){ai.streaming=false;if(e.name==='AbortError')ai.content=ai.content||'_Geração interrompida._';else ai.content='⚠️ **Não consegui gerar a resposta.**\n\n'+e.message+'\n\nRevise o provedor em **Configurações**.'}finally{busy=false;aborter=null;save();render()}}
function patchStreaming(id,text){const el=$$('.msg').find(x=>x.querySelector(`[data-copy="${id}"]`));if(el){const box=$('.md',el);box.innerHTML=md(text);box.classList.add('typing');const v=$('#chatView');if(v)v.scrollTop=v.scrollHeight}}
function sysMessages(msgs,context){return [{role:'system',content:state.settings.systemPrompt+(context?'\n\nContexto verificado por ferramentas:'+context:'')},...msgs.slice(-24).map(m=>({role:m.role,content:m.content}))]}
async function generate(msgs,input,context,onToken,signal){let p=state.settings.provider;if(p==='auto')p=globalThis.LanguageModel?'chrome':'demo';const all=sysMessages(msgs,context);if(p==='chrome')return chrome(all,onToken,signal);if(p==='ollama')return ollama(all,onToken,signal);if(p==='openai')return openai(all,onToken,signal);if(p==='backend')return backend(all,onToken,signal);return demo(input,context,onToken,signal)}
async function demo(input,context,onToken,signal){let t;if(context.includes('Resultado da calculadora'))t='Usei a calculadora local. **'+context.match(/Resultado da calculadora:\s*(.*)/)[1]+'**';else if(context.includes('Data e hora local'))t='Agora, no seu dispositivo, é **'+context.match(/Data e hora local:\s*(.*)/)[1]+'**.';else if(/^(oi|olá|ola|eai|e aí)\b/i.test(input))t='Olá. A Python AI está funcionando. Neste momento estou no **modo local de demonstração**. Para respostas generativas completas, conecte Chrome AI, Ollama, uma API compatível ou o backend Python em Configurações.';else t='Estou no **modo local de demonstração**. A interface, memória, projetos, arquivos, voz e ferramentas locais funcionam, mas esta resposta não veio de um LLM.\n\nAbra **Configurações → Modelo** para conectar um modelo generativo.\n\nSua mensagem: “'+input.slice(0,260)+(input.length>260?'…':'')+'”';for(const x of t.match(/.{1,18}/g)||[]){if(signal.aborted)throw new DOMException('Aborted','AbortError');onToken(x);await new Promise(r=>setTimeout(r,12))}return t}
async function chrome(msgs,onToken,signal){const LM=globalThis.LanguageModel;if(!LM)throw Error('A Prompt API do Chrome não está disponível nesta origem/dispositivo.');const a=await LM.availability?.();if(a==='unavailable')throw Error('O modelo nativo do Chrome está indisponível.');const s=await LM.create({initialPrompts:[{role:'system',content:state.settings.systemPrompt}]});const prompt=msgs.filter(x=>x.role!=='system').slice(-16).map(x=>(x.role==='user'?'Usuário':'Assistente')+': '+x.content).join('\n\n');if(s.promptStreaming){let full='';for await(const chunk of s.promptStreaming(prompt,{signal})){const d=chunk.startsWith(full)?chunk.slice(full.length):chunk;full=chunk;onToken(d)}return full}const t=await s.prompt(prompt,{signal});onToken(t);return t}
async function ollama(msgs,onToken,signal){const base=(state.settings.apiBase||'http://localhost:11434').replace(/\/$/,'');const r=await fetch(base+'/api/chat',{method:'POST',signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({model:state.settings.model||'llama3.2:3b',messages:msgs,stream:true,options:{temperature:state.settings.temperature}})});if(!r.ok)throw Error('Ollama retornou HTTP '+r.status+'. Verifique CORS e se o servidor está ativo.');const rd=r.body.getReader(),dec=new TextDecoder();let buf='',full='';while(1){const z=await rd.read();if(z.done)break;buf+=dec.decode(z.value,{stream:true});const ls=buf.split('\n');buf=ls.pop()||'';for(const l of ls)if(l.trim()){const d=JSON.parse(l),x=d.message?.content||'';if(x){full+=x;onToken(x)}}}return full}
async function openai(msgs,onToken,signal){let base=state.settings.apiBase.replace(/\/$/,'');if(!base)throw Error('Informe a URL base da API.');if(!base.endsWith('/v1'))base+='/v1';const r=await fetch(base+'/chat/completions',{method:'POST',signal,headers:{'Content-Type':'application/json',...(state.settings.apiKey?{Authorization:'Bearer '+state.settings.apiKey}:{})},body:JSON.stringify({model:state.settings.model||'default',messages:msgs,temperature:state.settings.temperature,stream:true})});if(!r.ok)throw Error('API retornou HTTP '+r.status);const rd=r.body.getReader(),dec=new TextDecoder();let buf='',full='';while(1){const z=await rd.read();if(z.done)break;buf+=dec.decode(z.value,{stream:true});const ls=buf.split('\n');buf=ls.pop()||'';for(const l of ls){if(!l.startsWith('data:'))continue;const raw=l.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const d=JSON.parse(raw),x=d.choices?.[0]?.delta?.content||'';if(x){full+=x;onToken(x)}}catch{}}}return full}
async function backend(msgs,onToken,signal){const base=state.settings.backendUrl.replace(/\/$/,'');if(!base)throw Error('Informe a URL do backend Python AI.');const r=await fetch(base+'/api/chat/stream',{method:'POST',signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,model:state.settings.model||null,temperature:state.settings.temperature})});if(!r.ok)throw Error('Backend retornou HTTP '+r.status);const rd=r.body.getReader(),dec=new TextDecoder();let full='';while(1){const z=await rd.read();if(z.done)break;for(const l of dec.decode(z.value,{stream:true}).split('\n'))if(l.startsWith('data:')){try{const d=JSON.parse(l.slice(5));if(d.delta){full+=d.delta;onToken(d.delta)}if(d.error)throw Error(d.error)}catch(e){if(e.message&&!e.message.includes('JSON'))throw e}}}return full}
async function checkStatus(){const el=$('#status');if(!el)return;let ok=true,label='Modo local';let p=state.settings.provider==='auto'?(globalThis.LanguageModel?'chrome':'demo'):state.settings.provider;try{if(p==='chrome'){const a=await globalThis.LanguageModel?.availability?.();ok=!!globalThis.LanguageModel&&a!=='unavailable';label=ok?'Chrome AI':'Chrome AI indisponível'}else if(p==='ollama'){const r=await fetch((state.settings.apiBase||'http://localhost:11434').replace(/\/$/,'')+'/api/tags');ok=r.ok;label=ok?'Ollama conectado':'Ollama offline'}else if(p==='backend'){const r=await fetch(state.settings.backendUrl.replace(/\/$/,'')+'/api/health');ok=r.ok;label=ok?'Backend conectado':'Backend offline'}else if(p==='openai'){ok=!!state.settings.apiBase;label=ok?'API configurada':'API não configurada'}}catch{ok=false;label=p+' offline'}el.innerHTML='<span class="dot '+(ok?'':'bad')+'"></span><span>'+esc(label)+'</span>'}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Reconhecimento de voz indisponível');return}const r=new SR();r.lang='pt-BR';r.onresult=e=>{const p=$('#prompt');if(p){p.value+=(p.value?' ':'')+e.results[0][0].transcript;p.dispatchEvent(new Event('input'))}};r.start();toast('Ouvindo…')}
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[#*_`]/g,''));u.lang='pt-BR';speechSynthesis.speak(u)}
function regenerate(mid){if(busy)return;const c=activeConv(),i=c.messages.findIndex(m=>m.id===mid),prev=[...c.messages.slice(0,i)].reverse().find(m=>m.role==='user');if(!prev)return;c.messages=c.messages.slice(0,c.messages.findIndex(m=>m.id===prev.id));save();render();setTimeout(()=>{$('#prompt').value=prev.content;$('#prompt').dispatchEvent(new Event('input'));sendPrompt()},20)}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='python-ai-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u)}
async function importBackup(f){if(!f)return;try{const n=JSON.parse(await f.text());if(!n.conversations||!n.settings)throw Error();state=n;save();document.querySelector('.modal-bg')?.remove();render();toast('Backup importado')}catch{toast('Backup inválido')}}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();newChat()}if((e.ctrlKey||e.metaKey)&&e.key===','){e.preventDefault();settingsModal()}if(e.key==='Escape'&&busy)aborter?.abort()});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
})();
</script></body></html>
