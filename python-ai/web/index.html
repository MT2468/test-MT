<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="description" content="Python AI, assistente pessoal com memória, projetos, arquivos, voz, ferramentas e controle seguro do navegador." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Python AI</title>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <input id="filePicker" type="file" multiple hidden />
  <input id="backupPicker" type="file" accept="application/json" hidden />

  <script src="https://js.puter.com/v2/"></script>
  <script>
    (() => {
      const DEFAULT_MODEL = 'gpt-5-nano';
      const makeMessages = (systemPrompt, prompt) => {
        const messages = [];
        if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
        messages.push({ role: 'user', content: prompt });
        return messages;
      };

      window.LanguageModel = {
        async create({ systemPrompt = '' } = {}) {
          return {
            async *promptStreaming(prompt) {
              if (!window.puter?.ai?.chat) throw new Error('Puter AI indisponível');
              const stream = await puter.ai.chat(makeMessages(systemPrompt, prompt), {
                model: DEFAULT_MODEL,
                stream: true
              });
              let full = '';
              for await (const part of stream) {
                const delta = part?.text || (part?.type === 'text' ? part.text : '') || '';
                if (!delta) continue;
                full += delta;
                yield full;
              }
            },
            async prompt(prompt) {
              if (!window.puter?.ai?.chat) throw new Error('Puter AI indisponível');
              const result = await puter.ai.chat(makeMessages(systemPrompt, prompt), {
                model: DEFAULT_MODEL
              });
              return result?.message?.content || result?.text || String(result || '');
            },
            destroy() {}
          };
        }
      };

      const renameChromeAI = root => {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        for (const node of nodes) {
          if (node.nodeValue?.includes('Chrome AI')) node.nodeValue = node.nodeValue.replaceAll('Chrome AI', 'Puter AI');
        }
      };
      new MutationObserver(mutations => {
        for (const mutation of mutations) {
          for (const node of mutation.addedNodes) {
            if (node.nodeType === 1) renameChromeAI(node);
          }
        }
      }).observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener('DOMContentLoaded', () => renameChromeAI(document.body));
    })();
  </script>

  <script src="./app.js" defer></script>
  <script src="./enhancements.js" defer></script>
  <script src="./browser-tools.js" defer></script>
</body>
</html>
