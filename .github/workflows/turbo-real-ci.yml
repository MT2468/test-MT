name: Turbo Real CI

on:
  pull_request:
    paths:
      - 'turbo-real/**'
      - '.github/workflows/turbo-real-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'turbo-real/**'
      - '.github/workflows/turbo-real-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turbo-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
