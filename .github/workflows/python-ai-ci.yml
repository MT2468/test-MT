name: Python AI CI

on:
  push:
    branches: [main]
    paths:
      - 'python-ai/**'
      - 'index.html'
      - '.github/workflows/python-ai-ci.yml'
  pull_request:
    paths:
      - 'python-ai/**'
      - 'index.html'
      - '.github/workflows/python-ai-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r python-ai/backend/requirements.txt
      - name: Check frontend JavaScript
        run: |
          node --check python-ai/web/app.js
          node --check python-ai/web/backend-sync.js
          node --check python-ai/web/context-controls.js
          node --check python-ai/web/browser-tools.js
          node --check python-ai/web/enhancements.js
          node --check python-ai/web/secure-storage.js
          node --check python-ai/web/sw.js
      - name: Check frontend secret handling
        run: |
          grep -q './secure-storage.js' python-ai/web/index.html
          grep -q 'python-ai-openai-key-session' python-ai/web/secure-storage.js
          grep -q "data.settings.openaiKey=''" python-ai/web/secure-storage.js
          grep -q "u.origin===cfg.origin" python-ai/web/secure-storage.js
          grep -q 'name="referrer" content="no-referrer"' python-ai/web/index.html
      - name: Check explicit context controls
        run: |
          grep -q './context-controls.js' python-ai/web/index.html
          grep -q 'PythonAIContextSelection' python-ai/web/context-controls.js
          grep -q 'getForConversation' python-ai/web/context-controls.js
          grep -q 'consumeForConversation' python-ai/web/context-controls.js
          grep -q 'nextFileIds' python-ai/web/context-controls.js
          grep -q 'Contexto da próxima mensagem' python-ai/web/context-controls.js
          grep -q 'useMemory' python-ai/web/context-controls.js
          grep -q 'data-py-file' python-ai/web/context-controls.js
          grep -q 'python-ai-backend-context' python-ai/web/context-controls.js
          grep -q 'Contexto usado:' python-ai/web/context-controls.js
          grep -q 'requestSelection' python-ai/web/backend-sync.js
          grep -q 'consumeSelection' python-ai/web/backend-sync.js
          grep -q 'syncSelectedFiles' python-ai/web/backend-sync.js
          grep -q "version:'1.6.0'" python-ai/web/backend-sync.js
      - name: Check backend context sync contract
        run: |
          grep -q './backend-sync.js' python-ai/web/index.html
          grep -q 'conversation_id' python-ai/web/backend-sync.js
          grep -q 'file_ids' python-ai/web/backend-sync.js
          grep -q 'use_memory:selection.useMemory' python-ai/web/backend-sync.js
          grep -q '/api/conversations' python-ai/web/backend-sync.js
          grep -q '/api/memories' python-ai/web/backend-sync.js
          grep -q '/api/files' python-ai/web/backend-sync.js
          grep -q 'reconcileDeleted' python-ai/web/backend-sync.js
          grep -q "method:'DELETE'" python-ai/web/backend-sync.js
          grep -q "method:'PATCH'" python-ai/web/backend-sync.js
          grep -q "method:'PUT'" python-ai/web/backend-sync.js
          grep -q 'patchRemote' python-ai/web/backend-sync.js
          grep -q 'fingerprints.conversations' python-ai/web/backend-sync.js
          grep -q 'exclusão remota pendente' python-ai/web/backend-sync.js
          grep -q 'prev!==fp' python-ai/web/backend-sync.js
          grep -q 'edição de conversa pendente' python-ai/web/backend-sync.js
          grep -q 'edição de memória pendente' python-ai/web/backend-sync.js
          grep -q 'edição de arquivo pendente' python-ai/web/backend-sync.js
          grep -q 'sincronização de contexto indisponível; usando requisição original' python-ai/web/backend-sync.js
          grep -q "@app.patch('/api/conversations/{cid}')" python-ai/backend/server.py
          grep -q "@app.patch('/api/memories/{mid}')" python-ai/backend/server.py
          grep -q "@app.put('/api/files/{fid}')" python-ai/backend/server.py
          grep -q "version='3.4.0'" python-ai/backend/server.py
          grep -q 'updated_at text' python-ai/backend/server.py
      - name: Check Browser Bridge extension
        run: |
          node --check python-ai/browser-extension/bridge.js
          node --check python-ai/browser-extension/service-worker.js
          python -m json.tool python-ai/browser-extension/manifest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('python-ai/browser-extension/manifest.json').read_text())
          assert manifest['manifest_version'] == 3
          assert manifest['version'] == '0.2.0'
          assert 'storage' in manifest['permissions']
          worker = Path('python-ai/browser-extension/service-worker.js').read_text()
          bridge = Path('python-ai/browser-extension/bridge.js').read_text()
          assert "audit.list" in worker
          assert "consent: 'granular'" in worker
          assert 'page.read' in bridge and 'window.confirm' in bridge
          PY
      - name: Check backend Python
        run: |
          python -m py_compile python-ai/backend/server.py python-ai/backend/model_router.py python-ai/backend/context_builder.py python-ai/backend/test_model_router.py python-ai/backend/test_context_builder.py python-ai/backend/test_server_updates.py
      - name: Run backend unit tests
        run: |
          cd python-ai/backend
          python -m unittest -v test_model_router.py test_context_builder.py test_server_updates.py
      - name: Check required web assets
        run: |
          test -f python-ai/web/index.html
          test -f python-ai/web/styles.css
          test -f python-ai/web/manifest.webmanifest
          test -f python-ai/web/icon.svg
          test -f python-ai/web/secure-storage.js
          test -f python-ai/web/backend-sync.js
          test -f python-ai/web/context-controls.js
          grep -q './styles.css' python-ai/web/index.html
          grep -q './app.js' python-ai/web/index.html
          grep -q './enhancements.js' python-ai/web/index.html
          grep -q "'./secure-storage.js'" python-ai/web/sw.js
          grep -q "'./backend-sync.js'" python-ai/web/sw.js
          grep -q "'./context-controls.js'" python-ai/web/sw.js
          grep -q "python-ai-definitive-v8" python-ai/web/sw.js
      - name: Smoke-test static serving
        run: |
          python -m http.server 4173 -d python-ai/web >/tmp/python-ai-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail http://127.0.0.1:4173/
          curl --fail http://127.0.0.1:4173/app.js >/dev/null
          curl --fail http://127.0.0.1:4173/backend-sync.js >/dev/null
          curl --fail http://127.0.0.1:4173/context-controls.js >/dev/null
          curl --fail http://127.0.0.1:4173/secure-storage.js >/dev/null
          curl --fail http://127.0.0.1:4173/styles.css >/dev/null
