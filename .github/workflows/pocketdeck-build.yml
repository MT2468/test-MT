name: Build PocketDeck APK

on:
  push:
    branches:
      - pocketdeck-apk-v1
    paths:
      - 'pocketdeck/**'
      - '.github/workflows/pocketdeck-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: pocketdeck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PocketDeck-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketDeck-v1.0-APK
          path: pocketdeck/dist/PocketDeck-v1.0.apk
          if-no-files-found: error
          retention-days: 30
