<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="0.42" stop-color="#171a4a"/><stop offset="0.72" stop-color="#5b216b"/><stop offset="1" stop-color="#f06167"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13183f"/><stop offset="0.45" stop-color="#07152f"/><stop offset="1" stop-color="#020713"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe8a3"/><stop offset="0.55" stop-color="#ff8b9e"/><stop offset="1" stop-color="#f542a7"/></linearGradient>
  <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171536"/><stop offset="1" stop-color="#08091a"/></linearGradient>
  <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b244f"/><stop offset="0.45" stop-color="#0c1230"/><stop offset="1" stop-color="#050818"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3bf3ff" stop-opacity=".32"/><stop offset=".5" stop-color="#8a5cff" stop-opacity=".15"/><stop offset="1" stop-color="#ff4fb8" stop-opacity=".26"/></linearGradient>
  <radialGradient id="haze"><stop offset="0" stop-color="#ff4fa3" stop-opacity=".42"/><stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="windows" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="none"/><rect x="7" y="8" width="7" height="11" rx="2" fill="#72f4ff" opacity=".65"/><rect x="20" y="8" width="7" height="11" rx="2" fill="#ff66c7" opacity=".42"/></pattern>
</defs>

