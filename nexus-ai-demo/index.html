<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="Nexus AI: chat multimodal com pesquisa, arquivos, criação, código, voz e memória." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>Nexus AI</title>
  <script src="https://js.puter.com/v2/"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@16.2.1/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand-row"><span class="logo">X</span><span class="brand">Nexus AI</span></div>
    <button id="newChat" class="new-chat">＋ Novo chat</button>
    <div class="sidebar-section-title">Conversas</div>
    <div id="chatList" class="chat-list"></div>
    <div class="sidebar-footer">
      <div class="account-card"><span class="avatar">N</span><div class="account-copy"><b id="accountName">Puter</b><span id="accountState">Conectando…</span></div></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="openDrawer" class="icon-btn mobile-only" aria-label="Abrir conversas">☰</button>
      <select id="modelSelect" class="top-select" aria-label="Modelo"><option value="auto">Auto · melhor disponível</option></select>
      <select id="reasoningSelect" class="top-select" aria-label="Nível de raciocínio">
        <option value="balanced">Balanced</option>
        <option value="maximum">Maximum</option>
        <option value="fast">Fast</option>
      </select>
      <div class="top-spacer"></div>
      <span class="status-dot"><i></i><span id="statusText">Online</span></span>
      <button id="exportChat" class="ghost-btn hide-mobile">Exportar</button>
      <button id="clearChat" class="icon-btn" title="Limpar chat" aria-label="Limpar chat">⌫</button>
    </header>

    <section class="chat-shell">
      <div id="messages" class="messages" aria-live="polite"></div>

      <div id="toolSheet" class="tool-sheet hidden" role="dialog" aria-label="Ferramentas">
        <div class="tool-grid">
          <button class="tool-button" data-action="files">📎<b>Arquivos</b><span>PDF, imagens, docs e mais</span></button>
          <button class="tool-button" data-action="camera">📷<b>Câmera</b><span>Fotografe e pergunte</span></button>
          <button class="tool-button" data-action="voice">🎙️<b>Voz</b><span>Transcreva sua fala</span></button>
          <button class="tool-button" data-action="image">🖼️<b>Imagem</b><span>Gerar ou editar no chat</span></button>
          <button class="tool-button" data-action="video">🎬<b>Vídeo</b><span>Crie um clipe por prompt</span></button>
          <button class="tool-button" data-action="file">📄<b>Criar arquivo</b><span>PDF, DOCX, XLSX, PPTX…</span></button>
          <button class="tool-button" data-action="python">⌘<b>Python</b><span>Executar código no navegador</span></button>
          <button class="tool-button" data-action="research">⌕<b>Pesquisa</b><span>Web atual com fontes</span></button>
          <button class="tool-button" data-action="council">✦<b>Council</b><span>Vários modelos, uma síntese</span></button>
          <button class="tool-button" data-action="export">↗<b>Exportar chat</b><span>Receba um link Markdown</span></button>
        </div>
      </div>

      <div id="commandMenu" class="command-menu hidden"></div>

      <div class="composer-wrap">
        <div id="attachmentTray" class="attachment-tray"></div>
        <div id="modeRail" class="mode-rail">
          <button class="mode-btn active" data-mode="auto"><strong>Auto</strong></button>
          <button class="mode-btn" data-mode="research">Pesquisa</button>
          <button class="mode-btn" data-mode="code">Código</button>
          <button class="mode-btn" data-mode="create">Criar</button>
          <button class="mode-btn" data-mode="council">Council</button>
        </div>
        <div class="composer">
          <button id="plusButton" class="plus-btn" aria-label="Adicionar ferramenta">＋</button>
          <textarea id="prompt" class="prompt" rows="1" placeholder="Pergunte, pesquise, crie um arquivo, imagem, vídeo, código…"></textarea>
          <button id="sendButton" class="send-btn" aria-label="Enviar">↑</button>
        </div>
        <div class="composer-note">A Nexus pode usar modelos e ferramentas pagas pela sua conta Puter. Links de arquivos gerados expiram.</div>
      </div>
    </section>
  </main>
</div>

<div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
<aside id="mobileDrawer" class="mobile-drawer">
  <div class="brand-row"><span class="logo">X</span><span class="brand">Nexus AI</span><div class="top-spacer"></div><button id="closeDrawer" class="icon-btn">×</button></div>
  <button id="mobileNewChat" class="new-chat">＋ Novo chat</button>
  <div class="sidebar-section-title">Conversas</div>
  <div id="mobileChatList" class="chat-list"></div>
  <div class="sidebar-footer"><button id="mobileExport" class="ghost-btn" style="width:100%">Exportar conversa</button></div>
</aside>

<input id="fileInput" type="file" multiple class="hidden" />
<input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden" />
<div id="toasts" class="toast-stack"></div>
<script type="module" src="app.js"></script>
</body>
</html>
